name: Build IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build unsigned IPA artifact
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash scripts/build_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFireBrowser-unsigned-ipa
          path: build/unsigned-ipa/ZenFireBrowser-unsigned.ipa
          if-no-files-found: error
