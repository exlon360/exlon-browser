name: Repository Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-project-files:
    name: Verify project files
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Info.plist
        run: plutil -lint ZenFireBrowser/Info.plist

      - name: Run project validator
        run: python3 scripts/validate_project.py
