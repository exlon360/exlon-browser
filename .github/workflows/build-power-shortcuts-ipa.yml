name: Build PowerShortcuts IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "power-shortcuts-v*"
    paths:
      - ".github/workflows/build-power-shortcuts-ipa.yml"
      - "PowerShortcuts/**"
      - "PowerShortcuts.xcodeproj/**"
      - "scripts/build_power_shortcuts_unsigned_ipa.sh"

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build unsigned PowerShortcuts IPA
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash scripts/build_power_shortcuts_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerShortcuts-unsigned-ipa
          path: build/power-shortcuts-unsigned-ipa/PowerShortcuts-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/power-shortcuts-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/power-shortcuts-unsigned-ipa/PowerShortcuts-unsigned.ipa
          generate_release_notes: true
