name: Build Nebula Rooms IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "nebula-v*"

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Build unsigned Nebula Rooms IPA
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash scripts/build_nebula_rooms_unsigned_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaRooms-unsigned-ipa
          path: build/nebula-rooms-unsigned-ipa/NebulaRooms-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/nebula-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/nebula-rooms-unsigned-ipa/NebulaRooms-unsigned.ipa
          generate_release_notes: true
